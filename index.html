<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Visor CAD 3D - Hollow Knight & STL</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            font-family: sans-serif;
            background-color: #1a1a1a;
        }
        #info {
            position: absolute;
            top: 10px;
            left: 10px;
            color: white;
            background: rgba(0,0,0,0.6);
            padding: 10px;
            border-radius: 5px;
            pointer-events: none;
        }
        #file-input-container {
            position: absolute;
            top: 10px;
            right: 10px;
            background: rgba(0,0,0,0.7);
            padding: 10px;
            border-radius: 5px;
            color: white;
        }
        /* Contenedor del Cubo CAD en la esquina inferior derecha */
        #viewcube-container {
            position: absolute;
            bottom: 20px;
            right: 20px;
            width: 120px;
            height: 120px;
            z-index: 10;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <div id="info">
        <h3>Visor 3D Estilo CAD</h3>
        <p>Arrastra para rotar | Scroll para zoom</p>
    </div>

    <div id="file-input-container">
        <label for="stl-file">Cargar STL propio:</label><br>
        <input type="file" id="stl-file" accept=".stl">
    </div>

    <!-- Contenedor para el Cubo de Orientación -->
    <div id="viewcube-container"></div>

    <!-- Importar Three.js y OrbitControls, STLLoader mediante CDN -->
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { STLLoader } from 'three/addons/loaders/STLLoader.js';

        // --- 1. CONFIGURACIÓN DE LA ESCENA PRINCIPAL ---
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x222222);

        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 1, 1000);
        camera.position.set(100, 100, 150);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        document.body.appendChild(renderer.domElement);

        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;

        // Iluminación
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.7);
        scene.add(ambientLight);

        const dirLight = new THREE.DirectionalLight(0xffffff, 1.2);
        dirLight.position.set(100, 200, 100);
        dirLight.castShadow = true;
        scene.add(dirLight);

        const gridHelper = new THREE.GridHelper(200, 50, 0x444444, 0x222222);
        gridHelper.position.y = -20;
        scene.add(gridHelper);

        let currentMesh = null;

        // Material por defecto para los modelos STL
        const defaultMaterial = new THREE.MeshStandardMaterial({
            color: 0xcccccc,
            roughness: 0.4,
            metalness: 0.2
        });

        // Función para cargar geometrías STL
        function loadSTLGeometry(geometry) {
            geometry.computeVertexNormals();
            if (currentMesh) scene.remove(currentMesh);

            currentMesh = new THREE.Mesh(geometry, defaultMaterial);
            currentMesh.castShadow = true;
            currentMesh.receiveShadow = true;
            
            // Centrar el modelo
            geometry.center();
            scene.add(currentMesh);
        }

        // Cargar un modelo inicial por defecto (o puedes incrustar el del caballerito)
        // Generemos un placeholder geométrico o cargador local si el usuario sube el archivo.
        // Simularemos una geometría inicial o cargaremos un archivo base si se dispone.
        const loader = new STLLoader();
        
        // Manejador de carga de archivos STL propios del usuario
        document.getElementById('stl-file').addEventListener('change', function(event) {
            const file = event.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.readAsArrayBuffer(file);
            reader.onload = function (e) {
                const contents = e.target.result;
                const geometry = loader.parse(contents);
                loadSTLGeometry(geometry);
            };
        });

        // --- 2. CONFIGURACIÓN DEL CUBO CAD (VIEW CUBE) ---
        const vcContainer = document.getElementById('viewcube-container');
        const vcScene = new THREE.Scene();
        const vcCamera = new THREE.PerspectiveCamera(50, 1, 0.1, 100);
        vcCamera.position.set(0, 0, 3.5);

        const vcRenderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        vcRenderer.setSize(120, 120);
        vcContainer.appendChild(vcRenderer.domElement);

        // Crear las caras del cubo con colores/texturas o etiquetas estilo CAD
        // Usaremos materiales distintos para las 6 caras principales (Frente, Atrás, Arriba, Abajo, Izquierda, Derecha)
        const faceColors = [
            0xff5555, // Derecha (X+)
            0xff9955, // Izquierda (X-)
            0x55ff55, // Arriba (Y+)
            0x5599ff, // Abajo (Y-)
            0xffff55, // Frente (Z+)
            0xff55ff  // Atrás (Z-)
        ];

        const vcMaterials = faceColors.map(color => new THREE.MeshBasicMaterial({ color: color }));
        const cubeGeometry = new THREE.BoxGeometry(1, 1, 1);
        const viewCube = new THREE.Mesh(cubeGeometry, vcMaterials);
        vcScene.add(viewCube);

        // Raycaster para detectar clics en el ViewCube
        const raycaster = new THREE.Raycaster();
        const mouse = new THREE.Vector2();

        vcContainer.addEventListener('click', (event) => {
            const rect = vcRenderer.domElement.getBoundingClientRect();
            mouse.x = ((event.clientX - rect.left) / vcRenderer.domElement.clientWidth) * 2 - 1;
            mouse.y = -((event.clientY - rect.top) / vcRenderer.domElement.clientHeight) * 2 + 1;

            raycaster.setFromCamera(mouse, vcCamera);
            const intersects = raycaster.intersectObject(viewCube);

            if (intersects.length > 0) {
                const faceIndex = Math.floor(intersects[0].faceIndex / 2);
                const distance = 150;

                // Animación o ajuste directo de la cámara principal según la cara cliqueada
                switch(faceIndex) {
                    let targetPos = new THREE.Vector3();
                    case 0: // Derecha (+X)
                        camera.position.set(distance, 0, 0); break;
                    case 1: // Izquierda (-X)
                        camera.position.set(-distance, 0, 0); break;
                    case 2: // Arriba (+Y)
                        camera.position.set(0, distance, 0.01); break;
                    case 3: // Abajo (-Y)
                        camera.position.set(0, -distance, 0.01); break;
                    case 4: // Frente (+Z)
                        camera.position.set(0, 0, distance); break;
                    case 5: // Atrás (-Z)
                        camera.position.set(0, 0, -distance); break;
                }
                controls.update();
            }
        });

        // --- 3. BUCLE DE RENDERIZADO ---
        function animate() {
            requestAnimationFrame(animate);

            // Sincronizar la rotación del ViewCube pequeño con la cámara principal
            viewCube.quaternion.copy(camera.quaternion).invert();

            controls.update();
            renderer.render(scene, camera);
            vcRenderer.render(vcScene, vcCamera);
        }
        animate();

        // Ajuste responsivo de ventana
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
